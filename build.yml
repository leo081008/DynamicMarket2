name: Build DynamicMarket JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Plugin JAR with Maven
        run: mvn clean package

      - name: Upload Finished JAR
        uses: actions/upload-artifact@v4
        with:
          name: DynamicMarket-Plugin-JAR
          path: target/DynamicMarket-26.3.0.jar